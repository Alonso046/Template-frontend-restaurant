<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Haz tu pedido</title>
    <!-- Importar tipografía moderna de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <header class="header">
            <div class="header-overlay">
                <h1>🍔 Burger Local</h1>
                <p>Selecciona tus productos y pide directo a nuestro WhatsApp</p>
            </div>
        </header>

        <!-- Menú Ocupa ahora el 100% del ancho -->
        <main class="container">
            <section class="menu-section" style="width: 100%;">
                <nav id="categories-container" class="categories-nav"></nav>
                <div id="products-container" class="products-grid"></div>
            </section>
        </main>

        <!-- Botón Flotante para abrir el carrito -->
        <button id="floating-cart-btn" class="floating-cart-btn" onclick="toggleCart()">
            🛒 Ver Carrito <span id="cart-badge" class="badge">0</span>
        </button>

        <!-- Carrito ahora es un Panel Lateral (Sidebar) oculto por defecto -->
        <aside id="cart-sidebar" class="cart-sidebar closed">
            <div class="cart-header">
                <h2>Tu Pedido 🛒</h2>
                <button onclick="toggleCart()" class="btn-close-sidebar">✖</button>
            </div>
            
            <ul id="cart-items" class="cart-items-list">
                <li class="empty-cart">Tu carrito está vacío</li>
            </ul>

            <div class="cart-summary">
                <div class="total-row">
                    <span>Total a pagar:</span>
                    <span id="cart-total">$0</span>
                </div>
                
                <form id="order-form" class="checkout-form">
                    <input type="text" id="customer-name" placeholder="Tu Nombre completo" required>
                    <input type="tel" id="customer-phone" placeholder="Tu Teléfono (ej: 56912345678)" required>
                    <textarea id="order-notes" placeholder="Notas adicionales"></textarea>
                    <button type="submit" id="btn-submit-order" class="btn-primary" disabled>Enviar pedido por WhatsApp</button>
                </form>
            </div>
        </aside>

        <script src="app.js"></script>
</body>
</html>
